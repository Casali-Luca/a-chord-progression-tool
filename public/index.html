<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progressione Accordi</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <header>
        <h1>Progressione Accordi</h1>
    </header>

    <main class="app-container">
        <section class="controls-panel">
            <div class="options-grid">
                <div class="input-group">
                    <label for="key-select">Tonalità</label>
                    <div class="select-wrapper">
                        <select id="key-select">
                            <option value="C">C (Do)</option>
                            <option value="G">G (Sol)</option>
                            <option value="D">D (Re)</option>
                            <option value="A">A (La)</option>
                            <option value="E">E (Mi)</option>
                            <option value="F">F (Fa)</option>
                            <option value="Bb">Bb (Si♭)</option>
                            <option value="Eb">Eb (Mi♭)</option>
                            <option value="Ab">Ab (La♭)</option>
                        </select>
                    </div>
                </div>
            <div class="input-group">
                <label for="mode-select">Scala / Modo</label>
                <div class="select-wrapper">
                    <select id="mode-select">
                        <option value="ionian">Ionio (Maggiore Naturale)</option>
                        <option value="dorian">Dorico (Minore con 6a Maj)</option>
                        <option value="phrygian">Frigio (Minore con 2a Min)</option>
                        <option value="lydian">Lidio (Maggiore con 4a Aum)</option>
                        <option value="mixolydian">Misolidio (Maggiore con 7a Min)</option>
                        <option value="aeolian">Eolio (Minore Naturale)</option>
                        <option value="locrian">Locrio (Diminuito)</option>
                        <option value="harmonic_minor">Minore Armonica</option>
                    </select>
                </div>
            </div>
                <div class="input-group">
                    <label for="clef-select">Chiave</label>
                    <div class="select-wrapper">
                        <select id="clef-select">
                            <option value="treble">Sol (Violino)</option>
                            <option value="bass">Fa (Basso)</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="accidental-select">Notazione Alterazioni</label>
                    <div class="select-wrapper">
                        <select id="accidental-select">
                            <option value="sharp">Diesis (#)</option>
                            <option value="flat">Bemolle (♭)</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="tuning-select">Visualizzazione</label>
                    <div class="select-wrapper">
                        <select id="tuning-select">
                            <option value="notes">Pentagramma Standard</option>
                            <option value="E,A,D,G,B,E">TAB Chitarra (Standard: E A D G B E)</option>
                            <option value="D,A,D,G,B,E">TAB Chitarra (Drop D: D A D G B E)</option>
                            <option value="E,A,D,G">TAB Basso (Standard: E A D G)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="presets-wrapper">
                <span class="label-title">Preset Rapidi:</span>
                <div class="preset-group">
                    <button class="btn btn-preset" data-preset="pop">Pop</button>
                    <button class="btn btn-preset" data-preset="jazz">Jazz</button>
                    <button class="btn btn-preset" data-preset="blues">Blues</button>
                    <button class="btn btn-preset" data-preset="epic">Epico</button>
                    <button class="btn btn-preset" data-preset="metal">Metal</button>
                    <button class="btn btn-preset" data-preset="ballad">Ballad</button>
                    <button class="btn btn-preset" data-preset="punk">Punk</button>
                    <button class="btn btn-preset" data-preset="soul">Soul</button>
                    <button class="btn btn-preset" data-preset="classico">Classico</button>
                    <button id="clear-btn" class="btn btn-preset btn-outline">Pulisci</button>
                </div>
            </div>

            <div id="chords-container" class="chords-container"></div>

            <div class="actions">
                <button id="add-chord-btn" class="btn btn-interactive btn-icon" title="Aggiungi Accordo">+</button>
                <button id="generate-btn" class="btn btn-interactive btn-primary">Genera Spartiti</button>
            </div>
        </section>

        <section id="sheets-container" class="sheets-container"></section>

        <button onclick="window.location.href='metronome.html'" class="btn btn-preset"> Metronomo</button>
    </main>

    <script src="script.js" type="module"></script>
</body>
</html>
